name: Test

# Runs on both Linux and Windows: the installer and the hook scripts have
# platform-specific paths (exec-form hook commands, line endings, console
# encoding), and a Windows-only regression is otherwise invisible until a user
# hits it.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: python -m pytest test -q

  powershell:
    name: install.ps1 syntax
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path docs/install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host $_ }
            throw "docs/install.ps1 has $($errors.Count) parse error(s)"
          }
          Write-Host 'docs/install.ps1 parsed cleanly'
